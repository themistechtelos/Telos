services:
  - type: web
    name: telos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-hosting.txt
    startCommand: gunicorn webapp:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: GMAIL_SENDER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: TELOS_HOSPEDADO
        value: "true"
      - key: TELOS_DEMO_MODE
        value: "true"
